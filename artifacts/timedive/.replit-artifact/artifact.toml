kind = "web"
previewPath = "/"
title = "TimeDive"
description = "TimeDive is a full-stack history learning web app that teaches history through short, AI-generated personalized stories. Users dive into different historical periods visualized as ocean depths, with a friendly mascot guiding them. Features include personalized story generation via Claude AI, progress tracking, badges, audio narration via Web Speech API, and email/password authentication."
version = "1.0.0"
id = "artifacts/timedive"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19321

[services.development]
run = "pnpm --filter @workspace/timedive run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/timedive", "run", "build" ]
serve = "static"
publicDir = "artifacts/timedive/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19321"
BASE_PATH = "/"
